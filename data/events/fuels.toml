# Surface fuel models for Rothermel's spread model, and the land-cover classes that map
# to them. Read by fire.rothermel. Loads in tons per acre, surface-area-to-volume ratios in
# 1/ft, depth in ft, dead moisture of extinction in percent, as the fuel model literature
# states them.
#
# PROVENANCE: the rows are Scott and Burgan 2005, "Standard fire behavior fuel models: a
# comprehensive set for use with Rothermel's surface fire spread model" (USDA Forest
# Service RMRS-GTR-153), written from memory on 2026-11-03 and NOT yet checked against the
# report's tables; every row says so. The URB row is not a fuel model at all: it is a
# guessed rate for fire moving through built-up land, which Rothermel's model does not
# describe, and a variant can turn it off. Check the numbers before trusting a result
# that depends on the shrub rows; the Santa Monica Mountains burn as chaparral (SH5, SH7).

[[fuel]]
id = "GR1"
title = "Short, sparse dry climate grass (Scott and Burgan fuel model 101)"
dead_1h_t_ac = 0.10
dead_10h_t_ac = 0.0
dead_100h_t_ac = 0.0
live_herb_t_ac = 0.30
live_woody_t_ac = 0.0
sav_1h = 2200
sav_herb = 2000
sav_woody = 9999
depth_ft = 0.4
mx_dead_pct = 15
confidence = "recalled"
source = "Scott and Burgan 2005, GR1; recalled, not checked"

[[fuel]]
id = "GR2"
title = "Low load, dry climate grass (Scott and Burgan fuel model 102)"
dead_1h_t_ac = 0.10
