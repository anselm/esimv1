dead_100h_t_ac = 0.0
live_herb_t_ac = 0.0
live_woody_t_ac = 0.0
sav_1h = 0
sav_herb = 0
sav_woody = 0
depth_ft = 0
mx_dead_pct = 0
confidence = "guess"
source = "Not Rothermel: the module moves fire through built-up cells at built_ros_m_min scaled by the wind, a guessed parameter the manifest can set to zero"

# Land-cover class (ESA WorldCover code) to fuel model. Classes not listed do not burn.
[[cover]]
code = 10
cover = "tree cover"
fuel = "TU1"
note = "in the Santa Monica Mountains mostly oak, sycamore and planted trees among houses; TU1 is a guess at the understorey"
[[cover]]
code = 20
cover = "shrubland"
fuel = "SH5"
note = "chaparral and coastal sage scrub; SH7 for the oldest, heaviest stands"
[[cover]]
code = 30
cover = "grassland"
fuel = "GR2"
[[cover]]
code = 40
cover = "cropland"
fuel = "GR1"
[[cover]]
code = 50
cover = "built-up"
fuel = "URB"
[[cover]]
code = 90
cover = "herbaceous wetland"
fuel = "GR1"
