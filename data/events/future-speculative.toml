# Speculative future events: things that could happen on the way to 2100, with the rough
# chance per year that the literature or common estimate gives, and the effect a run could
# apply if a seeded draw lands on one. A shock module (planned: events.shock) would draw at
# most one per run from this list by its weights and apply its effect to the modules that
# listen. The list is a data source for other tools too (digitaltwins.wiki may carry a copy
# as a timeline of speculative events), so the schema is flat.
#
# Schema: id, title, kind (astronomy | geology | solar | disease | war | economy | politics |
# ecology | technology), p_per_year (rough annual probability; absent when no figure is
# known), effect
# (a table of what a run could apply: forcing_w_m2 and forcing_years for a pulse on the
# energy balance; emissions_scale and emissions_years for a scaling of emissions; mortality
# as a fraction of world population; region as free text), magnitude (free text), source,
# confidence ("recalled" until checked), checked.
#
# PROVENANCE: every row and every number below was written from memory on 2026-11-05 by the
# esim session (Claude Fable 5.1) at Anselm's ask and NONE has been checked. The annual
# probabilities are the order of magnitude commonly quoted, not a fit; the effects are the
# session's own translation into the model's terms and should be read as placeholders until
# a source is beside each. Check a row before relying on it. The rows marked "from Anselm's
# list" came from a Google AI answer he supplied on 2026-11-05 and carry no probability.

[[event]]
id = "carrington-storm"
title = "A Carrington-class geomagnetic storm"
kind = "solar"
p_per_year = 0.01
magnitude = "grid and satellite damage over months; no direct climate effect"
effect = { emissions_scale = 0.97, emissions_years = 1 }
source = "Riley 2012 (about 12 percent per decade) is the commonly cited estimate"
confidence = "recalled"
checked = ""

