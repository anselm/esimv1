# Known future events: things on the calendar with a date, for a run to mark on its time
# axis and for other tools to reuse. One table per event. The list is a data source, not a
# forecast: an event is here because a body has scheduled or computed it, and the row says
# where that was read. Meant to be portable (digitaltwins.wiki may carry a copy as a
# timeline of known future events), so the schema is small and flat.
#
# Schema: id (slug), date (ISO; "YYYY" or "YYYY-MM" where the day is not fixed), title,
# kind (sport | astronomy | politics | space | treaty | technology | anniversary |
# demographics), where (free text), effect (what a run could do with it; "mark" for now),
# source (where the date was read), confidence: "wikipedia" means the row was read from the
# Wikipedia page named in source on the day stated in checked, which is a tertiary source
# and not the organiser's own page; "recalled" means written from memory and not yet read
# anywhere; "checked" is reserved for a row confirmed against the primary source.
#
# PROVENANCE: a first list of 24 rows was written from memory on 2026-11-05 by the esim
# session (Claude Fable 5.1) at Anselm's ask. The same morning Anselm pointed at Wikipedia's
# 2030s, 21st century and Timelines of the future pages; the session read those, the List of
# future astronomical events and the 3rd millennium page, and rebuilt the list from them:
# 88 rows, 82 read on Wikipedia and 6 still recalled. Dates that slip (space missions,
# decommissionings) are what the page said when read.

