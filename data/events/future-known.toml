# Known future events: things on the calendar with a date, for a run to mark on its time
# axis and for other tools to reuse. One table per event. The list is a data source, not a
# forecast: an event is here because a body has scheduled or computed it, and the row says
# who. Meant to be portable (digitaltwins.wiki may carry a copy as a timeline of known
# future events), so the schema is small and flat.
#
# Schema: id (slug), date (ISO; "YYYY" or "YYYY-MM" where the day is not fixed), title,
# kind (sport | astronomy | politics | space | treaty | technology | anniversary),
# where (free text), effect (what a run could do with it; usually "mark"), source (who
# fixed the date), confidence ("checked" against the source on a stated day, or "recalled"
# from memory and not yet checked), checked (the day and against what, or empty).
#
# PROVENANCE: every row below was written from memory on 2026-11-05 by the esim session
# (Claude Fable 5.1) at Anselm's ask and NONE has been checked against its source. Dates
# that slip (launches) are marked as planned. Check a row before relying on it, and set
# confidence = "checked" with the day.

