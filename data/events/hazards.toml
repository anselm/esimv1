# Possible events with rates: the chaos, the black swans, good and bad. See README.md.
# Seeded 2026-10-31 by the agent. Rates marked "guess" are guesses. Every cited rate
# needs its source opened and checked before promotion.

[[event]]
id = "geomagnetic-storm-carrington"
title = "Carrington-class geomagnetic storm"
category = "space-weather"
rate_per_year = 0.012
consequence = "Transformer damage, grid outages lasting weeks in affected latitudes, satellite losses, GNSS degradation."
module = "grid"
valence = "bad"
confidence = "projected"
source = "Riley 2012, Space Weather: about 12% per decade for a Carrington-class event; later estimates range lower"
known_since = "2012-02-01"
setting = "on"

[[event]]
id = "cascadia-m9"
title = "Cascadia subduction zone M8.7 to M9 earthquake and tsunami"
category = "geophysical"
rate_per_year = 0.003
consequence = "Coastal Pacific Northwest shaking for minutes, tsunami within 15 to 30 minutes, infrastructure loss for months."
valence = "bad"
confidence = "projected"
source = "Paleoseismic recurrence (about 10 to 15 percent in 50 years for a full-margin rupture, per USGS and Oregon State work); rate here is the agent's conversion"
known_since = "1990-01-01"
setting = "on"

