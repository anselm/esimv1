# Climate tipping elements: the global warming (deg C above pre-industrial) at which an
# assessment judged each likely to tip, as a central estimate with a range, and the
# timescale of the change once triggered. Read by the tipping.elements module, which flags
# the year a run's global anomaly passes each threshold. Nothing here feeds back yet.
#
# PROVENANCE: every row below was written from the agent's memory of Armstrong McKay et
# al. 2022, "Exceeding 1.5 degrees C global warming could trigger multiple climate tipping
# points", Science 377, eabn7950, Table 1. The numbers have NOT been checked against the
# paper from this machine. confidence = "recalled" means exactly that; promote a row to
# "checked" only after reading the paper's table, and correct it if it differs. The
# consequence column is a one-line paraphrase, not a quotation.

[[element]]
id = "greenland-ice-sheet"
title = "Greenland ice sheet collapse"
low_c = 0.8
central_c = 1.5
high_c = 3.0
timescale = "about 10,000 years (1,000 to 15,000)"
consequence = "about seven metres of sea level over millennia"
source = "Armstrong McKay et al. 2022, Table 1"
confidence = "recalled"

