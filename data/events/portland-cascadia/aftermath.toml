# Deaths and harm after the shaking stops, as claims: each row a channel the `people.aftermath`
# module applies, with its rate, the source the rate came from, how sure it is, and a switch.
# A row that is off is listed on the run page and not applied. Assembled 2026-11-12 (evening) by
# the esim session at Anselm's ask ("extend sim to model deaths better ... other impacts").

[inputs]
power_dependent_dme_multnomah = 4825      # HHS emPOWER REST service, county layer, read 2026-11-12: Medicare beneficiaries with a claim for electricity-dependent durable medical equipment
power_dependent_dme_washington = 3593
power_dependent_dme_clackamas = 3152
medicare_benes_multnomah = 137761         # same layer
medicare_benes_washington = 105971
medicare_benes_clackamas = 98351
population_multnomah = 815428             # 2020 census, recalled, not checked
population_washington = 600372            # 2020 census, recalled, not checked
population_clackamas = 421401             # 2020 census, recalled, not checked
power_dependent_note = "Medicare only: people under 65 on other insurance who depend on a device are not counted, so the share is a floor"

[[claim]]
id = "interrupted-care"
title = "Deaths from medical care interrupted by the loss of electricity, at a rate derived from Puerto Rico after Hurricane Maria (2017)"
on = "person_days_without_power"
rate = 4.55e-6
low = 0.17                                # the paper's 95 percent interval, 793 to 8,498 against 4,645, as factors
high = 1.83
per = "deaths per person per day without electricity"
source = "Kishore and others 2018, Mortality in Puerto Rico after Hurricane Maria, New England Journal of Medicine 379:162-170. The abstract and news reporting were read on 12 November 2026; the paper itself was not. It estimates 4,645 excess deaths from 20 September to 31 December 2017 and attributes one third of them to delayed or interrupted health care. The rate used here is that third, divided by Puerto Rico's population of 3.34 million (recalled from memory) and by 102 days. It is applied to each day each person in the modelled area spends without grid electricity."
confidence = "An analogy: a Caribbean island after an autumn hurricane, applied to a Pacific Northwest city after an earthquake in February. The paper's interval is wide, and its authors call their estimate an underestimate."
status = "on"

[[claim]]
id = "untreated-injuries"
title = "Deaths among people with life-threatening injuries on days when no hospital is open"
on = "untreated_life_threatening"
rate = 0.5
low = 0.5
high = 2.0
per = "the share of the untreated who die on each day that no hospital in the modelled area is open"
source = "Hazus defines severity 3 injuries as those that pose an immediate life-threatening condition if not treated adequately and expeditiously, such as crush syndrome, internal injuries and uncontrolled bleeding (FEMA, Earthquake Model Technical Manual, as quoted in the Downtown Anchorage Seismic Risk Assessment, read on 12 November 2026). The daily death rate is a guess."
confidence = "The definition is from the Hazus manual. The rate is a guess. On any day a hospital is open the model treats everyone still waiting, with no limit on capacity."
status = "on"

[[claim]]
id = "power-dependent-devices"
title = "People who depend on electrically powered medical devices and have no grid electricity (counted; no deaths added)"
on = "power_dependent_without_power"
rate = 0.0
low = 0.0
high = 0.0
per = "a count of people exposed, with no death rate"
source = "The emPOWER data of the US Department of Health and Human Services, read on 12 November 2026: 11,570 Medicare beneficiaries who use electricity-dependent medical devices in Multnomah, Washington and Clackamas counties, 0.63 percent of the counties' population. That share is applied to the residents of the modelled area. The Puerto Rico rate is taken to include deaths in this group already, so none are added here."
confidence = "The count is from the published data. It covers Medicare beneficiaries only, so it is a minimum. It is reported as a number of people exposed and is not converted into deaths."
status = "on"

[[claim]]
id = "cold"
title = "Deaths from cold in homes without electricity"
on = "person_days_without_power"
rate = 0.0
low = 0.0
high = 0.0
per = "deaths per person per day without electricity"
source = "No source was read. Excess deaths in winter are documented, but no rate for a power outage in a mild maritime climate was found on 12 November 2026."
confidence = "no source"
status = "off"

[[claim]]
id = "water"
title = "Deaths from waterborne illness while water and sewer service are out"
on = "person_days_without_water"
rate = 0.0
low = 0.0
high = 0.0
per = "deaths per person per day without water"
source = "No source was read."
confidence = "no source"
status = "off"
