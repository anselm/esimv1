# The Willamette River crossings in Portland, south to north, as the stakes of the lifelines
# model. Positions and opening years from Wikipedia's "List of crossings of the Willamette
# River" (read 2026-11-12, a tertiary source); owners as recalled and not checked; the
# statement on what survives is Multnomah County's, on its Earthquake Ready Burnside Bridge
# pages (read 2026-11-12): "Portland's aging downtown bridges are not expected to withstand a
# major earthquake", "it could be anywhere from weeks to years before any downtown bridge is
# usable after the earthquake", and a county spokesperson quoted by the Portland Mercury that
# none of Portland's bridges, Tilikum Crossing included, are expected to survive a Cascadia
# quake (that quote reached us through a web search summary, not read on the page).

[[bridge]]
name = "Sellwood Bridge"
lat = 45.4644
lon = -122.6656
opened = 2016
carries = "road"
owner = "Multnomah County (recalled)"

