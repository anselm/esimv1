# What `obs.losses` reads from this folder: a published loss study to hold the run's building
# damage and casualties against. The module knows nothing about Portland or DOGAMI; another
# scenario supplies its own folder with a file like this one. `{record}` in a file name is the
# module's `record` parameter (here wet or dry).
agency = "DOGAMI"
study = "DOGAMI's study"
source = "DOGAMI Open-File Report O-18-02 (2018), the loss tables of its Hazus run"

# The small areas the study reports by: a raster of ids on the run's grid and a table keyed by id.
[units]
raster = "nuid.tif"
table = "loss_unit_{record}.csv"
id = "NUID"
label = "neighbourhood units"

# One named group of the study's larger areas, compared as a total. The raster holds an area code
# per cell; the group is the codes from `code_min` to `code_max`, and the table's rows whose name
# begins with `rows_prefix`.
[group]
key = "portland"
label = "the nine districts of the City of Portland"
raster = "jurisdiction.tif"
code_min = 25
code_max = 33
table = "loss_jurisdiction_{record}.csv"
name = "Jurisdiction"
rows_prefix = "Portland"
# rows of the group table shown on the run page: names beginning or ending with these, or equal
show_prefix = ["Portland"]
show_suffix = ["Unincorporated"]
show_equal = ["Beaverton", "Gresham", "Hillsboro"]
show_columns = ["Jurisdiction", "Bldg_LR", "DisplacedPop", "CasDayL4", "CasNightL4", "CasDayL2", "CasDayL3", "PDsExtensive", "PDsComplete"]

# The study's column names. `{Time}` is Day or Night by the module's `time_of_day`.
[columns]
extensive = "PDsExtensive"
complete = "PDsComplete"
displaced = "DisplacedPop"
deaths = "Cas{Time}L4"
injuries = ["Cas{Time}L2", "Cas{Time}L3"]
