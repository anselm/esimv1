# The registry's catalog: where each base layer lives upstream, how to fetch it, under
# what licence, and how its tiles are named. Hashes of fetched files go in
# catalog.lock.toml so a manifest can pin bytes. Text half of the registry; the bytes
# are cached under data/cache (ignored by git) and mirrored on demand later.

[[asset]]
id = "copernicus-dem-glo30"
title = "Copernicus DEM GLO-30, global land surface elevation at one arc-second"
kind = "raster-tiles"
crs = "EPSG:4326"
resolution = "1 arc-second (about 30 m)"
units = "m above EGM2008 geoid"
format = "Cloud Optimized GeoTIFF, Float32, deflate with floating-point predictor, 1024-px internal tiles, 3600x3600 per one-degree tile"
# {lat} like N42 or S05, {lon} like W094 or E006; the tile's name gives its north-west corner's latitude floor and longitude floor.
url_template = "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_{lat}_00_{lon}_00_DEM/Copernicus_DSM_COG_10_{lat}_00_{lon}_00_DEM.tif"
tile_list = "https://copernicus-dem-30m.s3.amazonaws.com/tileList.txt"
source = "ESA Copernicus DEM, produced by Airbus, distributed on the AWS Open Data registry (bucket copernicus-dem-30m)"
licence = "Copernicus DEM licence: free use with attribution to ESA/Airbus; full text to be fetched and stored before promotion"
verified = "2026-10-31 from canada1: anonymous GET and range requests work; 26,450 tiles listed"
notes = "Land only; sea is nodata. Bathymetry (GEBCO) is a separate asset, not yet verified."

[[place]]
id = "boone-river-webster-city"
title = "Boone River above Webster City, Iowa"
why = "The stage for the milestone ladder: tile-drained Corn Belt, a USGS gauge with daily discharge since 1940, MODIS coverage, farms, drains to the Des Moines, Mississippi and the Gulf."
gauge = "USGS 05481000 Boone River near Webster City, IA; 42.4319722 N, 93.8059444 W; drainage area 844 sq mi; HUC 07100005; daily discharge (00060) 1940-03-09 to present"
verified = "2026-10-31 from canada1 via waterservices.usgs.gov site service"
dem_tiles = ["N42_W094", "N42_W095", "N43_W094", "N43_W095"]
notes = "Nitrate at this gauge: a short daily series 2012-2017 (parameter 83554) and about twenty ambient samples 2006-2025; the nitrogen scoreboard for M11 will need other Iowa sites or the state's water quality network."

[[asset]]
id = "usgs-nwis-daily"
title = "USGS National Water Information System daily values"
kind = "observation-series"
units = "discharge (00060) converted from ft3/s to m3/s by the reader"
format = "RDB tab-separated text from waterservices.usgs.gov/nwis/dv"
url_template = "https://waterservices.usgs.gov/nwis/dv/?format=rdb&sites={site}&parameterCd={parameter}&statCd=00003&startDT={start}&endDT={end}"
source = "US Geological Survey"
licence = "US federal public domain"
verified = "2026-10-31 from canada1: site 05481000 parameter 00060 for 2025 returned 365 daily values, codes A and A:e (approved, some estimated)"
notes = "Recent data are provisional and can be revised; the lock records the bytes a run used."

[[asset]]
id = "ghcn-daily"
title = "NOAA Global Historical Climatology Network Daily, by station"
kind = "observation-series"
units = "precipitation and temperature in tenths of mm and tenths of C in the file; the reader converts to mm and C"
format = "CSV per station: ID,DATE,ELEMENT,DATA_VALUE,M_FLAG,Q_FLAG,S_FLAG,OBS_TIME"
url_template = "https://noaa-ghcn-pds.s3.amazonaws.com/csv/by_station/{station}.csv"
source = "NOAA NCEI, distributed on the AWS Open Data registry (bucket noaa-ghcn-pds)"
licence = "US federal public domain; WMO Resolution 40 applies to some non-US stations"
verified = "2026-10-31 from canada1: station USC00138806 (Webster City, IA, 42.4686 N 93.7975 W) has PRCP, SNOW, TMAX, TMIN 1893 to 2026; 2025 has 362 precipitation days totalling 1,089.8 mm, observation time 0700 local"
notes = "Rows with a quality flag are dropped by the reader. Daily totals are for the 24 hours ending at the observation time."

[[asset]]
id = "open-meteo-era5"
title = "Open-Meteo historical weather API (ERA5 and ERA5-Land reanalysis), hourly by point"
kind = "observation-series"
units = "temperature_2m degC, precipitation mm, shortwave_radiation W/m2, relative_humidity_2m %, wind_speed_10m m/s"
format = "JSON; one request per point and date range"
url_template = "https://archive-api.open-meteo.com/v1/archive?latitude={lat}&longitude={lon}&start_date={start}&end_date={end}&hourly=temperature_2m,precipitation,shortwave_radiation,relative_humidity_2m,wind_speed_10m"
source = "Open-Meteo, serving ECMWF ERA5 and ERA5-Land reanalysis (Copernicus Climate Change Service)"
licence = "Open-Meteo API: free for non-commercial use only; a commercial tier exists. The underlying ERA5 data are under the Copernicus licence. Exact texts to be fetched and stored before promotion."
verified = "2026-10-31 and 2026-11-01 from canada1: anonymous requests for the Boone window at 0.25 and 0.5 degree point spacing; the archive lags about five days; the API sometimes answers a non-JSON streaming timeout, which the fetcher refuses and retries"
notes = "A paid service must not rely on this endpoint; pull ERA5 from the Climate Data Store or another licensed source into the shared cache instead."

[[asset]]
id = "open-meteo-gefs"
title = "Open-Meteo ensemble API, NOAA GEFS members, hourly by point"
kind = "forecast-ensemble"
units = "as open-meteo-era5"
format = "JSON; 31 members per variable per point"
url_template = "https://ensemble-api.open-meteo.com/v1/ensemble?latitude={lat}&longitude={lon}&hourly=temperature_2m,precipitation,shortwave_radiation,relative_humidity_2m,wind_speed_10m&models=gfs_seamless&past_days={past_days}&forecast_days={forecast_days}"
source = "Open-Meteo, serving NOAA Global Ensemble Forecast System (GEFS)"
licence = "Open-Meteo API: free for non-commercial use only. GEFS itself is US federal public domain and is also published directly by NOAA."
verified = "2026-11-01 from canada1: 31 members for the Boone window, past 10 days and 10 days ahead, used by the F1 forecast"
notes = "The exact model name and the member count in the query are as the fetcher sends them; see crates/registry/src/obs.rs."

[[asset]]
id = "modis-mod13a1"
title = "MODIS Terra vegetation indices, 16-day 500 m (MOD13A1, collection 6.1)"
kind = "raster-tiles"
crs = "MODIS sinusoidal"
resolution = "500 m, 16-day composites"
units = "NDVI scaled by 10000 in the file; the reader converts"
format = "Cloud Optimized GeoTIFF per tile and composite, found through the STAC API, read with a container SAS token"
url_template = "https://planetarycomputer.microsoft.com/api/stac/v1/search (collection modis-13A1-061); token from https://planetarycomputer.microsoft.com/api/sas/v1/token/modiseuwest/modis-061-cogs"
source = "NASA LP DAAC MODIS, mirrored by Microsoft Planetary Computer"
licence = "NASA Earth science data: free and open. Planetary Computer's terms govern the mirror. Exact texts to be fetched and stored before promotion."
verified = "2026-11-01 from canada1: tile h11v04 composites for 2025 fetched for M5; the catalog had none for July to November 2025; per-file signing is rate-limited, so one container token per run"
notes = "Reader: crates/registry/src/modis.rs; sinusoidal to lat-lon sampling."

