# The planet core, meant to be included: observed emissions into a carbon ledger, the
# impulse-response carbon cycle, methane and N2O from the records, the two-layer energy
# balance, thermal sea level, and the scoreboards. A manifest that includes this adds its
# own [run] and whatever sits on top. See manifests/p4-planet-people.toml.

[run]
name = "planet-core"
start = "1850-01-01"
end = "2025-01-01"
seed = 1
close_every = "30d"
notes = "The planet core alone: a hindcast to the end of the record. Include it from a scenario manifest."

[[module]]
name = "emissions"
kind = "carbon.emissions"
[module.params]
include_land_use = true
after_record = "hold"

[[module]]
name = "carbon"
kind = "carbon.pools"
[module.params]
co2_start_ppm = 286.8

[[module]]
name = "gases"
kind = "carbon.gases"

[[module]]
name = "energy"
kind = "energy.twolayer"
[module.params]
co2_ref_ppm = 286.8

[[module]]
name = "sea"
kind = "sea.thermal"

[[module]]
name = "obs"
kind = "obs.planet"
[module.params]
baseline_from = 1850
baseline_to = 1900

[audit]
scores = [["carbon.co2_ppm", "obs.co2_ppm"], ["energy.gmst_anom_c", "obs.gmst_hadcrut5_c"], ["energy.gmst_anom_c", "obs.gmst_gistemp_c"]]
