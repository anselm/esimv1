# M9 Takers: farm agents on blocks of cells choose corn or soybean, plant when the soil is
# workable, pay costs and sell the harvest, writing the fields the crop reads. A money
# ledger joins animals, carbon, energy and water. Prices and costs are stated guesses.

[run]
name = "m9-farms-boone-2025"
start = "2025-01-01"
end = "2026-01-01"
seed = 1
close_every = "1d"
snapshot_every = "60d"

[[module]]
name = "wx"
kind = "weather.era5"
[module.params]
lat_s = 42.3
lat_n = 43.2
lon_w = -94.2
lon_e = -93.5
res_arcsec = 30
start = "2025-01-01"
end = "2025-12-31"
dt = "1h"

[[module]]
name = "sun"
kind = "sun.irradiance"
[module.params]
lat_s = 42.3
lat_n = 43.2
lon_w = -94.2
lon_e = -93.5
res_arcsec = 30
dt = "1h"
report_every = "90d"

[[module]]
name = "water"
kind = "water.basin"
[module.params]
forcing = "wx"
lat_s = 42.3
lat_n = 43.2
lon_w = -94.2
lon_e = -93.5
res_arcsec = 30
dt = "1h"
report_every = "30d"

[[module]]
name = "veg"
kind = "veg.crop"
[module.params]
lat_s = 42.3
lat_n = 43.2
lon_w = -94.2
lon_e = -93.5
res_arcsec = 30
dt = "1h"

[[module]]
name = "deer"
kind = "fauna.herbivore"
[module.params]
res_arcsec = 30
init_density_km2 = 6

[[module]]
name = "coyote"
kind = "fauna.predator"
[module.params]
res_arcsec = 30
init_density_km2 = 0.3

[[module]]
name = "farms"
kind = "agents.farms"
[module.params]
res_arcsec = 30
block_cells = 4
price_corn_usd_bu = 4.3
price_soy_usd_bu = 10.2
