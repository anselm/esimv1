# P2, the 2100 scenario: the P1 planet run on to 2100 under one stated assumption, that
# the world keeps emitting at the 2024 rate for the rest of the century. That is not a
# forecast; it is the question "what if nothing changes". The hindcast part (1850 to
# 2024) is scored against the records as in P1. Everything P1 leaves out is still left
# out: other greenhouse gases, aerosols, sink saturation, climate-carbon feedback, and
# the impulse-response carbon cycle is known to keep too much CO2 airborne (devlog
# 20261101-p1-planet.md). The numbers after 2024 are therefore an upper-leaning sketch of
# the CO2-only commitment, and the project says so on its page.

[run]
name = "p2-planet-co2-held-2100"
start = "1850-01-01"
end = "2100-01-01"
seed = 1
close_every = "30d"
notes = "Zero-dimensional planet, 1850 to 2100, monthly steps. After 2024 emissions are held at the 2024 rate: an assumption, not a forecast. CO2 only."

[audit]
scores = [["carbon.co2_ppm", "obs.co2_ppm"], ["energy.gmst_anom_c", "obs.gmst_hadcrut5_c"], ["energy.gmst_anom_c", "obs.gmst_gistemp_c"]]

[[module]]
name = "emissions"
kind = "carbon.emissions"
[module.params]
include_land_use = true
after_record = "hold"

[[module]]
name = "carbon"
kind = "carbon.pools"
[module.params]
co2_start_ppm = 286.8

[[module]]
name = "energy"
kind = "energy.twolayer"
[module.params]
co2_ref_ppm = 286.8

[[module]]
name = "obs"
kind = "obs.planet"
[module.params]
baseline_from = 1850
baseline_to = 1900
