# M3 Water, June 2025 only, for tests and quick looks.

[run]
name = "m3-water-boone-june"
start = "2025-06-01"
end = "2025-07-01"
seed = 1
close_every = "1d"
snapshot_every = "10d"

[[module]]
name = "sun"
kind = "sun.irradiance"
[module.params]
lat_s = 42.3
lat_n = 43.2
lon_w = -94.2
lon_e = -93.5
res_arcsec = 30
dt = "1h"
report_every = "30d"

[[module]]
name = "water"
kind = "water.basin"
[module.params]
lat_s = 42.3
lat_n = 43.2
lon_w = -94.2
lon_e = -93.5
res_arcsec = 30
dt = "1h"
