# A project: who asked for what, in their words, and the manifest beside it.
area = "anselm"
name = "nicasio-2029"
title = "A fire at Devil's Gulch, October 2029"
featured = true
cover = "cover.png"
cover_caption = "The window from the run page's three-dimensional view: Samuel P. Taylor State Park and the Nicasio Valley from the elevation model, the vertical stretched twice, every OpenStreetMap building a box, the fire's arrival draped over the ground at the time cursor, and the two named places staked on it. The scale-5 run at 08:00 Pacific on 2 October, three hours after the fire reached the house; dark mode, 2026-11-08."
description = "A scenario, not a forecast: an ignition at the Devil's Gulch campsite in Samuel P. Taylor State Park, Marin County, at 3 a.m. on 1 October 2029, under the Red Flag wind of 27 to 29 October 2019 played hour for hour, on today's ground. The stake is a house, 550 Nicasio Valley Road, six kilometres east. Nobody fights the fire. Anselm asked for it on 2026-11-08: a brand new simulation of 550 Nicasio Valley Road, a fire starting not far away at Devil's Gulch campsite, 1 October, in 2029, with some wind conditions."
created = "2026-11-08"
by = "anselm, via claude 2026-11-08"

# Variants: the one fitted number from the Palisades at several values, and the gust instead of the mean wind.

[[variant]]
name = "scale-3"
title = "Ignition thresholds times 3"
[variant.set]
"fire.ignite_scale" = 3

[[variant]]
name = "scale-5"
title = "Ignition thresholds times 5: the Palisades' setting, unchanged"
[variant.set]
"fire.ignite_scale" = 5

[[variant]]
name = "scale-8"
title = "Ignition thresholds times 8: the Fort McMurray setting"
[variant.set]
"fire.ignite_scale" = 8

[[variant]]
name = "gust"
title = "Thresholds times 5, on the hour's gust instead of its mean wind"
[variant.set]
"fire.ignite_scale" = 5
"fire.wind_use" = "gust"
