# A project: who asked for what, in their words, and the manifest beside it.
area = "anselm"
name = "palisades-cells"
title = "The Palisades fire, cell by cell"
cover = "cover.png"
cover_caption = "The ground as the engine saw it, from the run page's three-dimensional view: the terrain from the elevation model, every building a box of its stated height, the fire's arrival draped over both at the time cursor. The near-4 run, dark mode, 2026-11-03."
description = "The same fire, the same ground and record, on an engine of our own: a heat budget on 30 m cells that know their elevation, land cover, buildings and roads, under NOAA's 3 km wind hour by hour. Every constant is a guess; one of them is fitted to the first infrared perimeter and declared; the structures the inspectors recorded are the test. Nobody fights the fire."
created = "2026-11-03"
by = "anselm, via claude 2026-11-03"

# Variants: the one fitted number at several values. Below 1 the window burns in hours; at 8 one cell cannot light the next.

[[variant]]
name = "scale-2"
title = "Ignition thresholds times 2"
[variant.set]
"fire.ignite_scale" = 2

[[variant]]
name = "scale-3"
title = "Ignition thresholds times 3"
[variant.set]
"fire.ignite_scale" = 3

[[variant]]
name = "scale-4"
title = "Ignition thresholds times 4"
[variant.set]
"fire.ignite_scale" = 4

[[variant]]
name = "scale-6"
title = "Ignition thresholds times 6"
[variant.set]
"fire.ignite_scale" = 6

[[variant]]
name = "near-2"
title = "Heat felt only by the next cell (reach 45 m), thresholds times 2"
[variant.set]
"fire.reach_m" = 45
"fire.ignite_scale" = 2

[[variant]]
name = "near-3"
title = "Heat felt only by the next cell (reach 45 m), thresholds times 3"
[variant.set]
"fire.reach_m" = 45
"fire.ignite_scale" = 3

[[variant]]
name = "near-4"
title = "Heat felt only by the next cell (reach 45 m), thresholds times 4"
[variant.set]
"fire.reach_m" = 45
"fire.ignite_scale" = 4

[[variant]]
name = "houses"
title = "Near reach, thresholds times 4, embers light houses, house to house"
[variant.set]
"fire.reach_m" = 45
"fire.ignite_scale" = 4
"fire.ember_built_p" = 0.5
"fire.built_to_built_gain" = 2.5

[[variant]]
name = "houses-jitter"
title = "As houses, with micro-conditions: each cell's threshold jittered by a fixed factor (sigma 0.6)"
[variant.set]
"fire.reach_m" = 45
"fire.ignite_scale" = 4
"fire.ember_built_p" = 0.5
"fire.built_to_built_gain" = 2.5
"fire.threshold_jitter" = 0.6

[[variant]]
name = "bodies"
title = "Near reach, thresholds times 4, every building a body of its own: threshold 15, gap scale 6 m, jitter 0.6"
[variant.set]
"fire.reach_m" = 45
"fire.ignite_scale" = 4
"fire.structures" = "on"
"fire.structure_ignite" = 15
"fire.house_lambda_m" = 6
"fire.structure_jitter" = 0.6

[[variant]]
name = "bodies-hard"
title = "As bodies, with the structure threshold at 25: half the destroyed reached, at the same precision"
[variant.set]
"fire.reach_m" = 45
"fire.ignite_scale" = 4
"fire.structures" = "on"
"fire.structure_ignite" = 25
"fire.house_lambda_m" = 6
"fire.structure_jitter" = 0.6

[[variant]]
name = "near-4-slope"
title = "Near reach, thresholds times 4, slope on the rate with Rothermel's shape (gain 20)"
[variant.set]
"fire.reach_m" = 45
"fire.ignite_scale" = 4
"fire.slope_rate_gain" = 20

[[variant]]
name = "near-4-slope-6"
title = "Near reach, thresholds times 4, slope on the rate at a milder gain (6)"
[variant.set]
"fire.reach_m" = 45
"fire.ignite_scale" = 4
"fire.slope_rate_gain" = 6

[[variant]]
name = "near-4-slope-soft"
title = "Near reach, thresholds times 4, Rothermel's uphill gain (20) with a gentle downhill division (2)"
[variant.set]
"fire.reach_m" = 45
"fire.ignite_scale" = 4
"fire.slope_rate_gain" = 20
"fire.downslope_gain" = 2

[[variant]]
name = "vector-4"
title = "The vector form (wind and slope as vectors, Rothermel's shape, Anderson's ellipse, idle cooling), thresholds times 4"
[variant.set]
"fire.form" = "vector"
"fire.cooling" = "idle"
"fire.reach_m" = 45
"fire.ignite_scale" = 4
"fire.slope_rate_gain" = 20

[[variant]]
name = "vector-6"
title = "The vector form (wind and slope as vectors, Rothermel's shape, Anderson's ellipse, idle cooling), thresholds times 6"
[variant.set]
"fire.form" = "vector"
"fire.cooling" = "idle"
"fire.reach_m" = 45
"fire.ignite_scale" = 6
"fire.slope_rate_gain" = 20

[[variant]]
name = "vector-5"
title = "The vector form: wind and slope as vectors with Rothermel's shape, Anderson's ellipse, idle cooling; thresholds times 5"
[variant.set]
"fire.form" = "vector"
"fire.cooling" = "idle"
"fire.reach_m" = 45
"fire.ignite_scale" = 5
"fire.slope_rate_gain" = 20

[[variant]]
name = "vector-8"
title = "The vector form, thresholds times 8: slower on the first day, nearer the record on the second"
[variant.set]
"fire.form" = "vector"
"fire.cooling" = "idle"
"fire.reach_m" = 45
"fire.ignite_scale" = 8
"fire.slope_rate_gain" = 20

[[variant]]
name = "vector-5-held"
title = "The vector form at 5, with the record's completed lines holding from their recorded time"
[variant.set]
"fire.form" = "vector"
"fire.cooling" = "idle"
"fire.reach_m" = 45
"fire.ignite_scale" = 5
"fire.slope_rate_gain" = 20
"fire.lines" = "hold"
