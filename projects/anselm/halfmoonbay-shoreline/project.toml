# A project: who asked for what, in their words, and the manifest beside it.
area = "anselm"
name = "halfmoonbay-shoreline"
title = "Half Moon Bay: the breakwater and the beach"
cover = "cover.png"
cover_caption = "Shoreline change along the bay south of Pillar Point Harbor after 64 years of the reanalysis waves on the one-line model, as built: metres landward (red) or seaward (blue) of today's line, along the transects, on the run page's map. 2026-11-08."
description = "The Half Moon Bay shoreline south of the Pillar Point Harbor breakwater, 1961 to 2025, on a one-line shoreline model: today's coast as transects, the ERA5-Ocean waves of the cell over the bay hour by hour, the headland and the breakwater as shadows with diffraction, the CERC transport, the bluff where the beach runs out, and two fitted numbers, the transport coefficient and the share of sand passing the breakwater's root that goes through its voids into the harbor. Read against the Corps' and Griggs's rates. Not a fluid dynamics model, and the page says so. Anselm asked for it on 2026-11-08: a separate sim for the Half Moon Bay dredging issue; the Army Corps built sea walls back in the day and they are eroding the coastline and filling the harbor with silt; this is a hard one."
created = "2026-11-08"
by = "anselm, via claude 2026-11-08"

[[variant]]
name = "as-built"
title = "The East Breakwater as built, sand through its voids at the fitted share"
[variant.set]
"coast.breakwater" = "on"

[[variant]]
name = "before-1959"
title = "The coast before the breakwater: Pillar Point alone shelters the bay"
[variant.set]
"coast.breakwater" = "off"

[[variant]]
name = "sealed"
title = "The breakwater sealed: no sand through its voids"
[variant.set]
"coast.leak_frac" = 0

[[variant]]
name = "to-2075-held"
title = "Fifty more years, sea level held"
[variant.set]
"run.end" = "2075-01-01"

[[variant]]
name = "to-2075-slr-high"
title = "Fifty more years with the Corps' high sea level case, 2.06 ft by 2075"
[variant.set]
"run.end" = "2075-01-01"
"coast.slr_m_yr" = 0.0126

[[variant]]
name = "to-2075-dredged"
title = "Fifty more years, the 2025 dredge repeated every five years onto Surfers Beach"
[variant.set]
"run.end" = "2075-01-01"
"coast.dredge_every_years" = 5
