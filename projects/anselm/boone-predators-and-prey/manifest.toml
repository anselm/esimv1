# M6 Eaters: a grazer and a predator as cohorts in the Boone River basin cells, on top of
# weather, sun, water and the crop. Population ledger (individuals) and carbon ledger
# through the animals must close. No scoreboard yet.

[run]
name = "m6-eaters-boone-2025"
start = "2025-01-01"
end = "2026-01-01"
seed = 1
close_every = "1d"
snapshot_every = "60d"

[[module]]
name = "wx"
kind = "weather.era5"
[module.params]
lat_s = 42.3
lat_n = 43.2
lon_w = -94.2
lon_e = -93.5
res_arcsec = 30
start = "2025-01-01"
end = "2025-12-31"
dt = "1h"

[[module]]
name = "sun"
kind = "sun.irradiance"
[module.params]
lat_s = 42.3
lat_n = 43.2
lon_w = -94.2
lon_e = -93.5
res_arcsec = 30
dt = "1h"
report_every = "90d"

[[module]]
name = "water"
kind = "water.basin"
[module.params]
forcing = "wx"
lat_s = 42.3
lat_n = 43.2
lon_w = -94.2
lon_e = -93.5
res_arcsec = 30
dt = "1h"
report_every = "30d"

[[module]]
name = "veg"
kind = "veg.crop"
[module.params]
lat_s = 42.3
lat_n = 43.2
lon_w = -94.2
lon_e = -93.5
res_arcsec = 30
dt = "1h"

[[module]]
name = "deer"
kind = "fauna.herbivore"
[module.params]
res_arcsec = 30
init_density_km2 = 6

[[module]]
name = "coyote"
kind = "fauna.predator"
[module.params]
res_arcsec = 30
init_density_km2 = 0.3
