[run]
name = "f4-fortmcmurray-cells"
start = "2016-05-01T22:00:00Z"
end = "2016-05-07T00:00:00Z"
seed = 1
close_every = "1d"
snapshot_every = "10d"
notes = "Our own engine on the Fort McMurray fire: heat budget on 30 m cells, OpenStreetMap buildings, ERA5 wind at one point; scored against CWFIS satellite hotspots; unsuppressed; constants carried over from the Palisades."

[[module]]
name = "ground"
kind = "ground.terrain"

[module.params.place]
lat_n = 56.85
lat_s = 56.55
lon_e = -111.15
lon_w = -111.75
res_arcsec = 1

[[module]]
name = "cover"
kind = "ground.cover"

[module.params.place]
lat_n = 56.85
lat_s = 56.55
lon_e = -111.15
lon_w = -111.75
res_arcsec = 1

[[module]]
name = "roads"
kind = "roads.major"

[module.params.place]
lat_n = 56.85
lat_s = 56.55
lon_e = -111.15
lon_w = -111.75
res_arcsec = 1

[[module]]
name = "buildings"
kind = "built.footprints"

[module.params]
source = "osm"

[module.params.place]
lat_n = 56.85
lat_s = 56.55
lon_e = -111.15
lon_w = -111.75
res_arcsec = 1

[[module]]
name = "weather"
kind = "weather.surface"

[module.params]
end = "2016-05-07T00:00:00Z"
source = "era5"
start = "2016-05-01T22:00:00Z"

[module.params.place]
lat_n = 56.85
lat_s = 56.55
lon_e = -111.15
lon_w = -111.75
res_arcsec = 1

[[module]]
name = "moisture"
kind = "fuel.moisture"

[module.params]

[[module]]
name = "fire"
kind = "fire.cells"

[module.params]
cooling = "idle"
form = "vector"
frame_res_arcsec = 4
ignite_scale = 5
ignition_lat = 56.66528
ignition_lon = -111.38333
ignition_time = "2016-05-01T22:00:00Z"
inputs = "world"
reach_m = 45
slope_rate_gain = 20

[module.params.place]
lat_n = 56.85
lat_s = 56.55
lon_e = -111.15
lon_w = -111.75
res_arcsec = 1

[[module]]
name = "animals"
kind = "fauna.flee"

[module.params]
density_km2 = 20

[[module]]
name = "obs"
kind = "obs.hotspots"

[module.params]
end = "2016-05-07T00:00:00Z"
every = "6h"
file = "fortmcmurray-2016/cwfis/hotspots.csv"
frame_res_arcsec = 4
start = "2016-05-01T00:00:00Z"

[module.params.place]
lat_n = 56.85
lat_s = 56.55
lon_e = -111.15
lon_w = -111.75
res_arcsec = 1

[audit]
scores = [[
    "sim.acres",
    "obs.acres",
]]
