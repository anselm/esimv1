# A project: who asked for what, in their words, and the manifest beside it.
area = "anselm"
name = "portland-cascadia"
title = "Portland, the year after Cascadia"
description = "A scenario, not a forecast: a M9.0 Cascadia rupture at 14:00 PST on 26 January 2027 under Portland on DOGAMI's synthetic site motions, saturated soils, daytime occupancy; the toll on DOGAMI's inventory; the year after on the Resilience Plan's ranges and the county's fuel-hub study; every constant published or declared a guess."
created = "2026-11-12"
by = "cli"
featured = true
cover = "cover.png"
cover_caption = "The run page's clock on day 25 of the base run, dark mode: the damage DOGAMI's ground does to the buildings, the crossings closed and the hospitals on the grid or on generators as marks, the counts beside; a still, the clock is on the run page"

[[variant]]
name = "wet-day"
title = "Saturated soils, 2 PM: DOGAMI's highest-impact case, and the base run"
[variant.set]
"ground.soils" = "wet"
"buildings.time_of_day" = "day"
"buildings.record" = "wet"

[[variant]]
name = "wet-night"
title = "Saturated soils, 2 AM: people at home"
[variant.set]
"ground.soils" = "wet"
"buildings.time_of_day" = "night"
"buildings.record" = "wet"
"ground.at" = "2027-01-26T10:00:00Z"

[[variant]]
name = "dry-day"
title = "Dry soils, 2 PM: shaking and landslides, no liquefaction"
[variant.set]
"ground.soils" = "dry"
"buildings.time_of_day" = "day"
"buildings.record" = "dry"

[[variant]]
name = "cut-20"
title = "The hub's stock cut by a fifth before the day: Ordinance 2026-312's 2036 target, applied to the stock"
[variant.set]
"lifelines.storage_cut" = 0.2

[[variant]]
name = "no-hub"
title = "The hub elsewhere: no fuel stored on the bank before the day; fuel arrives from outside once the routes work"
[variant.set]
"lifelines.storage_cut" = 1.0

[[variant]]
name = "retrofit"
title = "Every tank built to the post-2004 rule: at most a tenth of its contents leaves"
[variant.set]
"lifelines.retrofit" = true

[[variant]]
name = "burnside-ready"
title = "The earthquake-ready Burnside Bridge built: one crossing usable at once"
[variant.set]
"lifelines.bridge_ready" = ["Burnside Bridge"]

[[variant]]
name = "seed-2"
title = "The same scenario, another seed: other restoration days, another spill within the range"
[variant.set]
"run.seed" = 2

[[variant]]
name = "seed-3"
title = "A third seed"
[variant.set]
"run.seed" = 3
