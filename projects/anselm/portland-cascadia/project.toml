# A project: who asked for what, in their words, and the manifest beside it.
area = "anselm"
name = "portland-cascadia"
title = "Portland, the year after Cascadia"
description = "A magnitude 9 earthquake on the Cascadia subduction zone as it affects Portland, Oregon, set at 2 PM PDT on Friday 26 March 2027 as a scenario choice and not a prediction. Each run begins two weeks earlier and ends a year after the earthquake. Buildings, fuel tanks, bridges, transmission structures and road segments are damaged on the state geology agency's published ground shaking, with saturated soil and daytime occupancy, and the run then tracks electricity, hospitals, fuel and deaths day by day. This is an early model: several results disagree with the studies they are checked against, and many parameters are recalled from memory or guessed."
created = "2026-11-12"
by = "cli"
featured = true
cover = "cover.png"
cover_caption = "The run page seven days after the earthquake in the base run: building damage by cell, with the bridges and hospitals marked by their state and the counts beside the map. A still from the runs of 12 November 2026; the run page can be played."

[[variant]]
name = "wet-day"
title = "The base run: saturated soil, 2 PM, seed 1"
[variant.set]
"ground.soils" = "wet"
"buildings.time_of_day" = "day"
"buildings.record" = "wet"

[[variant]]
name = "wet-night"
title = "The earthquake at 2 AM, with people at home"
[variant.set]
"ground.soils" = "wet"
"buildings.time_of_day" = "night"
"agents.time_of_day" = "night"
"buildings.record" = "wet"
"ground.at" = "2027-03-26T09:00:00Z"

[[variant]]
name = "dry-day"
title = "Dry soil, 2 PM: almost no liquefaction"
[variant.set]
"ground.soils" = "dry"
"components.soils" = "dry"
"buildings.time_of_day" = "day"
"buildings.record" = "dry"

[[variant]]
name = "cut-20"
title = "20 percent less fuel held at the hub, a stronger measure than Ordinance 2026-312's 20 percent cut to tank capacity"
[variant.set]
"lifelines.storage_cut" = 0.2
"components.storage_cut" = 0.2

[[variant]]
name = "no-hub"
title = "No fuel held at the hub before the earthquake"
[variant.set]
"lifelines.storage_cut" = 1.0
"components.storage_cut" = 1.0

[[variant]]
name = "retrofit"
title = "Every tank meets the newer standard and releases at most 10 percent of its contents"
[variant.set]
"lifelines.retrofit" = true
"components.retrofit" = true

[[variant]]
name = "burnside-ready"
title = "Meant to keep the Burnside Bridge open. It has no effect: the setting is read only by the ranges version of the model"
[variant.set]
"lifelines.bridge_ready" = ["Burnside Bridge"]

[[variant]]
name = "ranges"
title = "An earlier version of the model: bridges, roads, electricity and the spill drawn from published ranges instead of computed from individual components"
[variant.set]
"lifelines.inputs" = "ranges"

[[variant]]
name = "seed-2"
title = "The base run with different random draws (seed 2)"
[variant.set]
"run.seed" = 2

[[variant]]
name = "seed-3"
title = "The base run with different random draws (seed 3)"
[variant.set]
"run.seed" = 3
