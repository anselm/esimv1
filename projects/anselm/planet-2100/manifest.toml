[audit]
scores = [
    [
    "carbon.co2_ppm",
    "obs.co2_ppm",
],
    [
    "energy.gmst_anom_c",
    "obs.gmst_hadcrut5_c",
],
    [
    "energy.gmst_anom_c",
    "obs.gmst_gistemp_c",
],
]

[[module]]
kind = "story.bottomline"
name = "story"

[[module]]
kind = "carbon.emissions"
name = "emissions"

[module.params]
after_record = "hold"
include_land_use = true

[[module]]
kind = "carbon.pools"
name = "carbon"

[module.params]
co2_start_ppm = 286.8

[[module]]
kind = "carbon.gases"
name = "gases"

[[module]]
kind = "forcing.ar6"
name = "assessed"

[module.params]
after_record = "hold"

[[module]]
kind = "energy.twolayer"
name = "energy"

[module.params]
co2_ref_ppm = 286.8

[[module]]
kind = "sea.thermal"
name = "sea"

[[module]]
kind = "obs.planet"
name = "obs"

[module.params]
baseline_from = 1850
baseline_to = 1900

[[module]]
kind = "people.countries"
name = "people"

[module.params]
distribution = "worldpop"
frame_every_years = 10
frame_res_deg = 1.0
res_deg = 0.5
scale = "50m"

[[module]]
kind = "climate.countries"
name = "climate"

[module.params]
anom_from = 2011
anom_to = 2020
cells_clim_from = 2001
cells_clim_to = 2025
frame_every_years = 10
frame_res_deg = 1.0
pattern = "cells"
res_deg = 0.5
scale = "50m"

[[module]]
kind = "people.heat"
name = "heat"

[module.params]
baseline = "cells"
crossing_share = 0.5
frame_every_years = 10
frame_res_deg = 1.0
niche_c = 29.0
pattern = "country"
res_deg = 0.5
scale = "50m"

[[module]]
kind = "people.wetbulb"
name = "wetbulb"

[module.params]
crossing_share = 0.5
frame_every_years = 10
frame_res_deg = 1.0
pattern = "country"
res_deg = 0.5
scale = "50m"
source = "cells"
year_from = 2011
year_to = 2020

[[module]]
kind = "tipping.elements"
name = "tipping"

[module.params]
coupling = 0.0

[[module]]
kind = "carbon.tipped"
name = "tipped"

[module.params]
trigger = "central"

[[module]]
kind = "events.shock"
name = "wildcards"

[module.params]
mode = "off"

[[module]]
kind = "score.regions"
name = "regions"

[module.params]
scale = "50m"

[[module]]
kind = "policy.capacity"
name = "capacity"

[module.params]
mode = "watch"

[run]
close_every = "30d"
end = "2100-01-01"
name = "p4-planet-people"
notes = "Planet core plus people on half-degree cells, each country's warming from its record, heat and wet-bulb exposure cell by cell from a reanalysis baseline, and tipping thresholds, 1850 to 2100. After 2024 emissions follow the variant's assumption (default: held at the 2024 rate). CO2, CH4 and N2O forcing; the AR6 assessed series held after 2019; the Millar sink feedback; of the tipping elements, the carbon of permafrost and the Amazon feeds back once the run passes the assessment's central estimates, the rest are flags. The warming applied to each cell is its country's fitted slope times the run's global anomaly; the reanalysis's own trend map is drawn but not applied."
seed = 1
start = "1850-01-01"
