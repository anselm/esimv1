# A project: who asked for what, in their words, and the manifest beside it.
area = "anselm"
name = "planet-2100"
title = "Earth 2100"
featured = true
cover = "cover.png"
cover_caption = "People living outside the human climate niche in 2091 with emissions held at the 2024 rate: the held run's own field, one-degree cells, log scale, drawn 2026-11-03."
description = "The planet to 2100 under six assumptions about emissions, with the people and the thresholds on each path. The planet core (observed emissions into a carbon ledger, impulse-response sinks, methane and N2O, a two-layer energy balance, thermal sea level) with countries on top: people per country from the UN, each country's temperature from its own record scaled by the run's warming, the people living outside the human climate niche, and the tipping elements' thresholds checked against the warming. Variants: the hindcast to 2025; emissions held at the 2024 rate to 2100; emissions to zero by 2050. Each is an assumption, never a forecast."
created = "2026-11-02"
by = "anselm, via claude 2026-11-01"

# Variants: named parameter sets applied on top of the manifest. `esim project run
# anselm/planet --variant held`. Keys are run.<field> or <module>.<param>.

[[variant]]
name = "hindcast"
title = "The record, 1850 to 2025"
[variant.set]
"run.end" = "2025-01-01"

[[variant]]
name = "held"
title = "Emissions held at the 2024 rate to 2100"
[variant.set]
"emissions.after_record" = "hold"

[[variant]]
name = "zero-by-2050"
title = "Emissions to zero by 2050"
[variant.set]
"emissions.after_record" = "zero_by:2050"

[[variant]]
name = "trend"
title = "Emissions continue the record's last-decade growth (about 0.3% a year)"
[variant.set]
"emissions.after_record" = "trend:10"

[[variant]]
name = "growing"
title = "Emissions grow 1% a year to 2100"
[variant.set]
"emissions.after_record" = "grow:1"

[[variant]]
name = "held-low"
title = "Emissions held; tipping elements release carbon from the low end of their ranges"
[variant.set]
"emissions.after_record" = "hold"
"tipped.trigger" = "low"

[[variant]]
name = "falling"
title = "Emissions fall 3% a year from 2025"
# The cut rate Anderson and Bows (2008, Phil. Trans. R. Soc. A) examined, which Monbiot
# (Guardian, 2009-03-16) reported as still leading to about four degrees by 2100; added
# 2026-11-02 so that claim can be checked against this model. Their start year was 2020.
[variant.set]
"emissions.after_record" = "grow:-3"

[[variant]]
name = "wild-1"
title = "Emissions held, with wild cards drawn (seed 1)"
# the speculative-event list drawn each year by the run's seed; the list's chances are
# recalled orders of magnitude and the effects are placeholders (2026-11-05)
[variant.set]
"emissions.after_record" = "hold"
"wildcards.mode" = "draw"
"run.seed" = 1

[[variant]]
name = "wild-2"
title = "Emissions held, with wild cards drawn (seed 2)"
[variant.set]
"emissions.after_record" = "hold"
"wildcards.mode" = "draw"
"run.seed" = 2

[[variant]]
name = "wild-3"
title = "Emissions held, with wild cards drawn (seed 3)"
[variant.set]
"emissions.after_record" = "hold"
"wildcards.mode" = "draw"
"run.seed" = 3

[[variant]]
name = "eruption-2040"
title = "Emissions held; a Tambora-class eruption in 2040"
[variant.set]
"emissions.after_record" = "hold"
"wildcards.mode" = "named"
"wildcards.event" = "vei7-eruption"
"wildcards.at" = "2040"

[[variant]]
name = "wild-4x"
title = "Emissions held, wild cards drawn four times as often (seed 1)"
[variant.set]
"emissions.after_record" = "hold"
"wildcards.mode" = "draw"
"wildcards.scale" = 4
"run.seed" = 1
