[run]
name = "f2-palisades-2025"
start = "2025-01-07T18:00:00Z"
end = "2025-01-12T00:00:00Z"
seed = 1
close_every = "1d"
snapshot_every = "10d"
notes = "The Palisades fire's first four days under reanalysis wind, unsuppressed; scored against NIFC's daily perimeters. Fuel parameters recalled from Scott and Burgan 2005 and not yet checked; the reanalysis under-reads Santa Ana gusts."

[[module]]
name = "fire"
kind = "fire.rothermel"

[module.params]
ignition_lat = 34.0723
ignition_lon = -118.5451
ignition_time = "2025-01-07T18:30:00Z"
wind_end = "2025-01-14"
wind_start = "2025-01-06"

[module.params.place]
lat_n = 34.16
lat_s = 34
lon_e = -118.46
lon_w = -118.72
res_arcsec = 1

[[module]]
name = "obs"
kind = "obs.perimeters"

[module.params]
incident = "Palisades"
irwin = "{A7EA5D21-F882-44B8-BF64-44AB11059DC1}"
year = 2025

[module.params.place]
lat_n = 34.16
lat_s = 34
lon_e = -118.46
lon_w = -118.72
res_arcsec = 1

[[module]]
name = "seen"
kind = "obs.hotspots"

[module.params]
end = "2025-01-12T00:00:00Z"
every = "1h"
file = "palisades-2025/viirs/hotspots.csv"
frame_res_arcsec = 3
land_only = true
series = "seen"
start = "2025-01-07T18:00:00Z"

[module.params.place]
lat_n = 34.16
lat_s = 34
lon_e = -118.46
lon_w = -118.72
res_arcsec = 1

[[module]]
name = "structures"
kind = "obs.dins"

[module.params]
key = "cal-fire-dins/2025-palisades"
service = "https://services1.arcgis.com/jUJYIo9tSA7EHvfZ/arcgis/rest/services/DINS_2025_Palisades_Public_View/FeatureServer/0"

[module.params.place]
lat_n = 34.16
lat_s = 34
lon_e = -118.46
lon_w = -118.72
res_arcsec = 1

[[module]]
name = "record"
kind = "obs.record"

[module.params]
files = [
    "palisades-2025/nifc/palisades-event-points.geojson",
    "palisades-2025/nifc/palisades-event-lines.geojson",
]
time_field = "CreateDate"

[module.params.place]
lat_n = 34.16
lat_s = 34
lon_e = -118.46
lon_w = -118.72
res_arcsec = 1

[[module]]
name = "suppression"
kind = "fire.suppression"

[module.params]
line_width_m = 30
mode = "off"

[module.params.place]
lat_n = 34.16
lat_s = 34
lon_e = -118.46
lon_w = -118.72
res_arcsec = 1

[audit]
scores = [[
    "sim.acres",
    "obs.acres",
]]
