# A project: who asked for what, in their words, and the manifest beside it.
area = "anselm"
name = "palisades-2025"
title = "The Palisades fire, January 2025"
featured = true
cover = "cover.png"
cover_caption = "Where the model's unsuppressed fire had reached 27 hours after ignition, coloured by the hour it arrived (yellow first, red last), on the reanalysis wind; in white the first infrared perimeter the incident mapped at that hour (15,824 acres), in blue the final perimeter (23,448 acres). Land cover beneath: trees, shrub, grass, built-up, the sea. Drawn from the run's own frames, 2026-11-03."
description = "The Palisades fire of 7 January 2025 run again on its own ground: Rothermel's spread model on 30 m terrain, fuel from land cover, the hour's wind from the ERA5 reanalysis, ignited where and when the record says, with no one fighting it. NIFC's mapped perimeters score the burned area as each was current. Variants: the reanalysis wind as read; its gusts; built-up land as a barrier; the heavier shrub model. A hindcast of a known event, not a forecast."
created = "2026-11-03"
by = "anselm, via claude 2026-11-03"

# Variants: named parameter sets applied on top of the manifest. Keys are <module>.<param>.

[[variant]]
name = "reanalysis"
title = "The ERA5 wind as read, 25 km, at the window's centre"
[variant.set]
"fire.wind_source" = "mean"

[[variant]]
name = "gusts"
title = "The ERA5 hourly gust as the wind: the upper bound the reanalysis allows"
[variant.set]
"fire.wind_source" = "gust"

[[variant]]
name = "built-barrier"
title = "Built-up land does not carry fire"
[variant.set]
"fire.built_ros_m_min" = 0

[[variant]]
name = "sh7"
title = "Shrubland as the very high load model SH7"
[variant.set]
"fire.shrub_fuel" = "SH7"
